databaseChangeLog:
  - changeSet:
      id: create-user-roles
      author: Artem
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: user_roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
        - addUniqueConstraint:
            tableName: user_roles
            columnNames: user_id, role
            constraintName: uq_user_roles_user_role
