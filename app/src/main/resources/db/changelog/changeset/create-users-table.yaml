databaseChangeLog:
  - changeSet:
      id: create-users
      author: Artem
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: foreign_id
                  type: bigint
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: is_reminder_active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
